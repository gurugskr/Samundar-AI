name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip
          pip install --upgrade pip==23.3.1
          pip install cython==0.29.36 buildozer==1.5.0

      - name: Build APK
        run: |
          rm -rf bin
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          mkdir -p $HOME/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea6b09e" >> $HOME/.android/licenses/android-sdk-license
          yes | sdkmanager --licenses || true
          buildozer android update || true
          mkdir -p.buildozer/android/platform/android-sdk/licenses
          cp $HOME/.android/licenses/android-sdk-license.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: Samundar-APK
          path: bin/*.apk
