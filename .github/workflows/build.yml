name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install Cython==3.0.11 buildozer==1.5.0 kivy==2.2.0 legacy-cgi
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "import sys; import legacy_cgi as cgi; sys.modules['cgi']=cgi" > $SITE/sitecustomize.py
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a563342" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea" > ~/.android/licenses/android-sdk-preview-license
      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-APK
          path: bin/*.apk
