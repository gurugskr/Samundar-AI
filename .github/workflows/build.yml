name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Fix Build-Tools 37 Bug
        run: |
          # System SDK me dono version install karo
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-33" || true
          
          # Buildozer ke andar build-tools folder banao
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/
          
          # 33.0.2 ko Buildozer ke andar copy karo
          cp -r $ANDROID_HOME/build-tools/33.0.2 ~/.buildozer/android/platform/android-sdk/build-tools/ || true
          
          # IMPORTANT HACK: 37.0.0 ko bhi 33.0.2 se bana do (kyunki 37 me aidl nahi hai)
          rm -rf ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          cp -r $ANDROID_HOME/build-tools/33.0.2 ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          
          # List check
          ls ~/.buildozer/android/platform/android-sdk/build-tools/

      - name: Build APK
        run: |
          rm -rf bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-AI-APK
          path: bin/*.apk
