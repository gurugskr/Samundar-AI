name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install and Build
        run: |
          ls -la
          python -m pip install --upgrade pip
          pip install kivy
          python -m py_compile main.py
          mkdir -p dist
          cp main.py dist/
          echo "Build Success - main.py is OK"
          ls -la dist/

      - name: Upload Samundar
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-Build
          path: dist/
