name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Build
        run: |
          ls -la
          python -m pip install --upgrade pip
          pip install kivy
          python -m py_compile main.py
          echo "Build Success - main.py is OK"
