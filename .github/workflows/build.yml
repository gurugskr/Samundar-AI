name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Buildozer Fixed
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev libsqlite3-dev
          pip install --upgrade pip
          pip install Cython==3.0.11
          pip install buildozer==1.5.0
          pip install kivy==2.2.0
          pip install legacy-cgi
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "import sys; import legacy_cgi as cgi; sys.modules['cgi']=cgi" > $SITE/sitecustomize.py
          echo "Fix OK"
      - name: Build APK
        run: |
          rm -rf .buildozer bin
          yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-APK
          path: bin/*.apk
