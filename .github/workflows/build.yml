name: build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Buildozer deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool
          pip install --upgrade pip
          pip install buildozer cython

      - name: Fix buildozer.spec conflict
        run: |
          sed -i '/^version.regex/d' buildozer.spec || true
          cat buildozer.spec | grep "^version"

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          # license accept karne ke liye ye sabse zaroori step hai
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # agar upar wala path nahi hai to buildozer khud bana lega, isliye ye bhi
          buildozer --version

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
