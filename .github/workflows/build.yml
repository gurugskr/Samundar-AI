name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer + P4A Develop
        run: |
          sudo apt update -y
          sudo apt install -y zip unzip wget
          pip install --upgrade pip
          pip install Cython==0.29.36 legacy-cgi
          pip install https://github.com/kivy/python-for-android/archive/develop.zip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          PYTHON_PATH=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "try:
            import cgi
          except ImportError:
            import legacy_cgi as cgi
            import sys
            sys.modules['cgi']=cgi" > $PYTHON_PATH/sitecustomize.py

      - name: Pre-Install SDK Hack
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O ct.zip
          unzip -q ct.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059f7416b044" >> $ANDROID_HOME/licenses/android-sdk-license
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;33.0.2" "platform-tools" "platforms;android-33" || true
          cp -r $ANDROID_HOME/build-tools/33.0.2 $ANDROID_HOME/build-tools/37.0.0 || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-AI-APK
          path: bin/*.apk
