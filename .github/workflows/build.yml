name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libffi-dev libssl-dev libltdl-dev libsqlite3-dev
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install https://github.com/kivy/python-for-android/archive/develop.zip
          pip install https://github.com/kivy/buildozer/archive/master.zip

      - name: Build APK
        run: |
          # ye 2 line bahut zaruri hai warna sdkmanager error ayega
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          touch $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-AI-APK
          path: bin/*.apk
