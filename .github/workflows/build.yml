name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y libtinfo5 libncurses5-dev openjdk-17-jdk zip unzip
          pip install --upgrade pip==23.3.1
          pip install cython==0.29.36 buildozer==1.5.0

      - name: Accept Licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          echo "y" | sdkmanager --licenses || true
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;34.0.0" "platform-tools" "platforms;android-33" || true

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: Samundar-APK
          path: bin/*.apk
