name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Force Accept Android Licenses and Install Build-Tools
        run: |
          export SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "build-tools;37.0.0" "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          # extra license copy for buildozer's own sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
