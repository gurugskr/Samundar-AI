name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check where package.json is
        run: |
          ls -la
          find . -name "package.json" -type f

      - name: Install and Build
        working-directory: ./Samundar-AI
        run: |
          npm install
          npm run build
