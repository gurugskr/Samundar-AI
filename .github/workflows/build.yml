name: Build Samundar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython
      - name: Build APK
        run: |
          rm -rf .buildozer bin || true
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # पहली बार SDK download होगा, fail हो सकता है - ठीक है
          yes | buildozer android debug || true
          # अब Buildozer के अंदर वाले SDK का license accept करो
          SDK_PATH=$HOME/.buildozer/android/platform/android-sdk
          CMDLINE=$SDK_PATH/cmdline-tools/latest/bin
          yes | $CMDLINE/sdkmanager --licenses || true
          $CMDLINE/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platform-tools" || true
          # अब Final build
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-APK
          path: bin/*.apk
