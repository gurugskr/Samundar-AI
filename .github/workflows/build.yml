name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          ls -la
          PKG_PATH=$(find . -name "package.json" | head -n 1)
          echo "Found package.json at: $PKG_PATH"
          DIR=$(dirname $PKG_PATH)
          echo "Installing in dir: $DIR"
          cd $DIR
          npm install
          npm run build || npm run dev --help || echo "no build script"
