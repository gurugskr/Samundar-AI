name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install JAVA and Deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 kivy

      - name: Install Android SDK
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip -d $HOME/android_sdk/cmdline-tools
          mv $HOME/android_sdk/cmdline-tools/cmdline-tools $HOME/android_sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android_sdk
          export ANDROID_SDK_ROOT=$HOME/android_sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25b"

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/android_sdk
          ANDROID_SDK_ROOT: /home/runner/android_sdk
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-AI-APK
          path: bin/*.apk
