name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install https://github.com/kivy/python-for-android/archive/develop.zip
          pip install https://github.com/kivy/buildozer/archive/master.zip

      - name: Build
        run: |
          # 1. Fix cgi module for Python 3.10
          PYLIB=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo -e "import sys\ntry:\n import cgi\n import html\n cgi.escape = html.escape\nexcept Exception:\n pass" > $PYLIB/sitecustomize.py

          # 2. Fix sdkmanager path BEFORE buildozer starts
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/tools/bin
          mkdir -p $ANDROID_HOME/cmdline-tools/latest/bin
          if [! -f $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ]; then
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mkdir -p $ANDROID_HOME/cmdline-tools/latest
            mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          fi
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager || true
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license

          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
