name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Find pubspec.yaml
        run: |
          pwd
          ls -la
          find . -name "pubspec.yaml"

      - name: Get packages
        run: flutter pub get
        working-directory: ./Sar  # <-- Yaha apne folder ka naam likho

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./Sar  # <-- Yaha bhi same folder naam

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samundar-AI-APK
          path: Sar/build/app/outputs/flutter-apk/app-release.apk
